<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Fondo Obsidiana con luz cenital -->
    <radialGradient id="bg-glow" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#111C35"/>
      <stop offset="100%" stop-color="#03060C"/>
    </radialGradient>

    <!-- Gradiente Espectral PAWLO (Bio-Mint -> Cyber Cyan -> Electric Indigo) -->
    <linearGradient id="pawlo-mesh" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="50%" stop-color="#00D9F5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Gradiente Coral de Pulso Vital -->
    <linearGradient id="pawlo-pulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A5F"/>
      <stop offset="100%" stop-color="#FF758C"/>
    </linearGradient>

    <!-- Brillo Especular -->
    <linearGradient id="rim-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#00F5A0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Escudo Squircle iOS Flagship -->
  <rect x="4" y="4" width="112" height="112" rx="32" fill="url(#bg-glow)" stroke="url(#rim-light)" stroke-width="2.5"/>

  <!-- Anillo de Radar Orbital Sutil -->
  <circle cx="60" cy="64" r="40" stroke="url(#pawlo-mesh)" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- 4 Nodos Satelitales (Dedos Geométricos en Arco Áureo) -->
  <!-- Nodo 1 (Izquierda) -->
  <g transform="rotate(-28 29 52)">
    <rect x="20" y="39" width="18" height="25" rx="9" fill="url(#pawlo-mesh)"/>
  </g>
  <!-- Nodo 2 (Centro-Izquierda) -->
  <g transform="rotate(-9 47 36)">
    <rect x="38" y="22" width="18.5" height="27" rx="9.25" fill="url(#pawlo-mesh)"/>
  </g>
  <!-- Nodo 3 (Centro-Derecha) -->
  <g transform="rotate(9 73 36)">
    <rect x="63.5" y="22" width="18.5" height="27" rx="9.25" fill="url(#pawlo-mesh)"/>
  </g>
  <!-- Nodo 4 (Derecha) -->
  <g transform="rotate(28 91 52)">
    <rect x="82" y="39" width="18" height="25" rx="9" fill="url(#pawlo-mesh)"/>
  </g>

  <!-- Almohadilla Central Escultural (Corazón Invertido + Pin Geodésico) -->
  <path d="M60 52 C41 52, 30 66, 35 82 C38.5 92, 49 97, 60 97 C71 97, 81.5 92, 85 82 C90 66, 79 52, 60 52 Z" fill="url(#pawlo-mesh)"/>

  <!-- Cavidad Interna de Precisión -->
  <circle cx="60" cy="76" r="11" fill="#050914"/>

  <!-- Núcleo Biométrico Coral (Pulso de Vida) -->
  <path d="M60 71.5 C58 68.5, 53.5 69.5, 53.5 73 C53.5 76.5, 60 81.5, 60 81.5 C60 81.5, 66.5 76.5, 66.5 73 C66.5 69.5, 62 68.5, 60 71.5 Z" fill="url(#pawlo-pulse)"/>
</svg>
